<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World ✨ | Peace O1</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #08090d;
      --card-bg: rgba(255, 255, 255, 0.035);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-hover-border: rgba(255, 255, 255, 0.22);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary-gradient: linear-gradient(135deg, #a855f7 0%, #6366f1 50%, #38bdf8 100%);
      --accent-glow: rgba(99, 102, 241, 0.35);
      --theme-hue: 245;
    }

    [data-theme="emerald"] {
      --primary-gradient: linear-gradient(135deg, #10b981 0%, #06b6d4 50%, #3b82f6 100%);
      --accent-glow: rgba(16, 185, 129, 0.35);
      --theme-hue: 160;
    }

    [data-theme="sunset"] {
      --primary-gradient: linear-gradient(135deg, #f43f5e 0%, #fb923c 50%, #facc15 100%);
      --accent-glow: rgba(244, 63, 94, 0.35);
      --theme-hue: 15;
    }

    [data-theme="cyber"] {
      --primary-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #a855f7 100%);
      --accent-glow: rgba(0, 242, 254, 0.35);
      --theme-hue: 190;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Ambient dynamic background lighting */
    #bg-canvas, #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    #confetti-canvas {
      z-index: 50;
    }

    .ambient-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      transition: background 0.8s ease, transform 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    /* Outer Wrapper for 3D perspective */
    .perspective-container {
      perspective: 1200px;
      z-index: 10;
      padding: 24px;
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: center;
    }

    /* Glassmorphic 3D Card */
    .card {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 44px 38px;
      box-shadow: 
        0 25px 60px -15px rgba(0, 0, 0, 0.7),
        0 0 40px -10px var(--accent-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.15s ease-out;
      transform-style: preserve-3d;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    }

    .card:hover {
      border-color: var(--card-hover-border);
    }

    /* Header Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.03em;
      margin-bottom: 24px;
      transform: translateZ(25px);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Headline Typography */
    .title-container {
      margin-bottom: 12px;
      transform: translateZ(40px);
    }

    .greeting-title {
      font-size: clamp(2.8rem, 7vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.1;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 20px var(--accent-glow));
    }

    .multilingual-subtitle {
      font-size: 1.15rem;
      color: var(--text-muted);
      min-height: 1.7em;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 400;
      transform: translateZ(30px);
    }

    .typewriter-text {
      color: #e2e8f0;
      font-weight: 600;
      border-right: 2px solid #6366f1;
      padding-right: 4px;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { border-color: transparent; }
      50% { border-color: #6366f1; }
    }

    /* Interactive Code Box */
    .code-box {
      margin: 28px 0;
      background: rgba(7, 8, 12, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px 20px;
      position: relative;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.92rem;
      transform: translateZ(35px);
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .window-dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot.red { background: #ef4444; }
    .dot.yellow { background: #eab308; }
    .dot.green { background: #22c55e; }

    .lang-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .code-content {
      line-height: 1.6;
      color: #94a3b8;
    }

    .syntax-keyword { color: #f43f5e; font-weight: 600; }
    .syntax-var { color: #38bdf8; }
    .syntax-string { color: #a3e635; }
    .syntax-func { color: #c084fc; }

    /* Action Buttons */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
      transform: translateZ(45px);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: #ffffff;
      box-shadow: 0 8px 24px -4px var(--accent-glow);
    }

    .btn-primary:hover {
      box-shadow: 0 12px 30px 0 var(--accent-glow);
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.07);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .btn-icon-only {
      padding: 12px;
      aspect-ratio: 1;
    }

    /* Audio Toggle */
    .sound-badge {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 60;
      background: rgba(15, 17, 23, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sound-badge:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* Live Time Footer */
    .card-footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      transform: translateZ(25px);
    }

    .footer-live-time {
      font-family: 'JetBrains Mono', monospace;
      color: #cbd5e1;
    }

    /* Interactive Notification Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      background: rgba(15, 17, 23, 0.95);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      padding: 12px 22px;
      border-radius: 14px;
      font-size: 0.9rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 600px) {
      .card {
        padding: 30px 22px;
      }
      .button-group {
        flex-direction: column;
      }
      .btn {
        width: 100%;
        justify-content: center;
      }
      .sound-badge {
        top: 14px;
        right: 14px;
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient background glow ball tracking cursor -->
  <div class="ambient-glow" id="ambient-glow"></div>

  <!-- Interactive canvas particles -->
  <canvas id="bg-canvas"></canvas>

  <!-- Confetti canvas for celebrations -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Sound Toggle -->
  <button class="sound-badge" id="sound-btn" title="Toggle audio feedback">
    <svg id="sound-icon-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
    <svg id="sound-icon-on" style="display:none;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    </svg>
    <span id="sound-status-text">Audio: Muted</span>
  </button>

  <!-- 3D Perspective Card Container -->
  <main class="perspective-container">
    <article class="card" id="tilt-card">
      
      <!-- Status Badge -->
      <div class="status-badge">
        <span class="pulse-dot"></span>
        <span>Environment Online • Peace O1</span>
      </div>

      <!-- Main Headline -->
      <div class="title-container">
        <h1 class="greeting-title" id="main-greeting">Hello, World!</h1>
        <div class="multilingual-subtitle">
          <span>Speaking: </span>
          <span class="typewriter-text" id="typewriter">Earth</span>
        </div>
      </div>

      <!-- Live Code Block -->
      <div class="code-box">
        <div class="code-header">
          <div class="window-dots">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
          </div>
          <span class="lang-label">JavaScript</span>
        </div>
        <div class="code-content">
          <div><span class="syntax-keyword">const</span> <span class="syntax-var">message</span> = <span class="syntax-string">"Hello, World! ✨"</span>;</div>
          <div><span class="syntax-func">console</span>.<span class="syntax-func">log</span>(<span class="syntax-var">message</span>);</div>
        </div>
      </div>

      <!-- Interactive Actions -->
      <div class="button-group">
        <button class="btn btn-primary" id="celebrate-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
          </svg>
          Celebrate!
        </button>

        <button class="btn btn-secondary" id="cycle-lang-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          Translate
        </button>

        <button class="btn btn-secondary" id="theme-btn" title="Cycle Theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
          </svg>
          Theme Aura
        </button>

        <button class="btn btn-secondary btn-icon-only" id="copy-btn" title="Copy Greeting">
          <svg id="copy-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </div>

      <!-- Card Footer -->
      <footer class="card-footer">
        <div>Coordinates: <span style="color:#e2e8f0;">Peace O1</span></div>
        <div class="footer-live-time" id="clock">00:00:00</div>
      </footer>

    </article>
  </main>

  <!-- Interactive Toast Notification -->
  <div class="toast" id="toast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
    <span id="toast-message">Copied to clipboard!</span>
  </div>

  <script>
    /* ==========================================================
       1. SYNTHESIZED AUDIO (Web Audio API)
       ========================================================== */
    let audioEnabled = false;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, type = 'sine', duration = 0.25, gainVal = 0.1) {
      if (!audioEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);

        gain.gain.setValueAtTime(gainVal, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn('Audio playback error', e);
      }
    }

    function playCelebrationChord() {
      if (!audioEnabled) return;
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C Major arpeggio
      notes.forEach((freq, idx) => {
        setTimeout(() => playTone(freq, 'triangle', 0.4, 0.08), idx * 80);
      });
    }

    const soundBtn = document.getElementById('sound-btn');
    const soundIconOff = document.getElementById('sound-icon-off');
    const soundIconOn = document.getElementById('sound-icon-on');
    const soundStatusText = document.getElementById('sound-status-text');

    soundBtn.addEventListener('click', () => {
      audioEnabled = !audioEnabled;
      if (audioEnabled) {
        getAudioContext();
        soundIconOff.style.display = 'none';
        soundIconOn.style.display = 'block';
        soundStatusText.textContent = 'Audio: Active';
        playTone(660, 'sine', 0.2, 0.1);
        showToast('Sound enabled 🎵');
      } else {
        soundIconOff.style.display = 'block';
        soundIconOn.style.display = 'none';
        soundStatusText.textContent = 'Audio: Muted';
        showToast('Sound muted 🔇');
      }
    });

    /* ==========================================================
       2. TYPEWRITER & MULTILINGUAL GREETINGS
       ========================================================== */
    const greetings = [
      { text: "Hello, World!", lang: "English 🇬🇧" },
      { text: "Bonjour, le monde !", lang: "Français 🇫🇷" },
      { text: "¡Hola, Mundo!", lang: "Español 🇪🇸" },
      { text: "こんにちは、世界！", lang: "Japanese 🇯🇵" },
      { text: "Hallo, Welt!", lang: "Deutsch 🇩🇪" },
      { text: "Ciao, Mondo!", lang: "Italiano 🇮🇹" },
      { text: "Olá, Mundo!", lang: "Português 🇧🇷" },
      { text: "مرحباً بالعالم!", lang: "Arabic 🌍" },
      { text: "你好，世界！", lang: "Chinese 🇨🇳" },
      { text: "안녕하세요, 세계!", lang: "Korean 🇰🇷" }
    ];

    let currentGreetingIdx = 0;
    const mainGreeting = document.getElementById('main-greeting');
    const typewriterEl = document.getElementById('typewriter');
    let isTyping = false;

    function displayGreeting(index) {
      const item = greetings[index];
      mainGreeting.textContent = item.text;
      typewriterEl.textContent = item.lang;
      playTone(520, 'sine', 0.15, 0.05);
    }

    function cycleGreeting() {
      currentGreetingIdx = (currentGreetingIdx + 1) % greetings.length;
      displayGreeting(currentGreetingIdx);
      showToast(`Switched to ${greetings[currentGreetingIdx].lang}`);
    }

    document.getElementById('cycle-lang-btn').addEventListener('click', cycleGreeting);

    /* ==========================================================
       3. 3D TILT EFFECT
       ========================================================== */
    const card = document.getElementById('tilt-card');
    const ambientGlow = document.getElementById('ambient-glow');

    window.addEventListener('mousemove', (e) => {
      // Move ambient spotlight
      ambientGlow.style.transform = `translate(${e.clientX - 300}px, ${e.clientY - 300}px)`;

      // Calculate tilt
      const rect = card.getBoundingClientRect();
      const cardX = rect.left + rect.width / 2;
      const cardY = rect.top + rect.height / 2;

      const angleX = (cardY - e.clientY) / 25;
      const angleY = (e.clientX - cardX) / 25;

      card.style.transform = `rotateX(${angleX}deg) rotateY(${angleY}deg)`;
    });

    card.addEventListener('mouseleave', () => {
      card.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });

    /* ==========================================================
       4. THEME SWITCHER
       ========================================================== */
    const themes = ['', 'emerald', 'sunset', 'cyber'];
    let themeIndex = 0;

    document.getElementById('theme-btn').addEventListener('click', () => {
      themeIndex = (themeIndex + 1) % themes.length;
      const selected = themes[themeIndex];
      if (selected) {
        document.body.setAttribute('data-theme', selected);
      } else {
        document.body.removeAttribute('data-theme');
      }
      playTone(440, 'triangle', 0.2, 0.08);
      const name = selected ? selected.toUpperCase() : 'VIOLET ECLIPSE';
      showToast(`Aura: ${name}`);
    });

    /* ==========================================================
       5. CONFETTI CELEBRATION ENGINE
       ========================================================== */
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confCtx = confettiCanvas.getContext('2d');
    let confettiParticles = [];

    function resizeConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    class Confetti {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 8 + 5;
        this.color = ['#38bdf8', '#a855f7', '#f43f5e', '#facc15', '#22c55e', '#6366f1'][Math.floor(Math.random() * 6)];
        this.vx = (Math.random() - 0.5) * 16;
        this.vy = Math.random() * -14 - 4;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 12;
        this.opacity = 1;
        this.gravity = 0.45;
        this.drag = 0.985;
      }
      update() {
        this.vx *= this.drag;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.rotationSpeed;
        this.opacity -= 0.012;
      }
      draw() {
        confCtx.save();
        confCtx.translate(this.x, this.y);
        confCtx.rotate((this.rotation * Math.PI) / 180);
        confCtx.globalAlpha = Math.max(0, this.opacity);
        confCtx.fillStyle = this.color;
        confCtx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.6);
        confCtx.restore();
      }
    }

    function triggerConfetti() {
      const rect = card.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;

      for (let i = 0; i < 90; i++) {
        confettiParticles.push(new Confetti(originX, originY));
      }
      playCelebrationChord();
    }

    function renderConfetti() {
      confCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.update();
        p.draw();
        if (p.opacity <= 0 || p.y > confettiCanvas.height) {
          confettiParticles.splice(i, 1);
        }
      }
      requestAnimationFrame(renderConfetti);
    }
    renderConfetti();

    document.getElementById('celebrate-btn').addEventListener('click', triggerConfetti);

    /* ==========================================================
       6. INTERACTIVE BACKGROUND PARTICLES
       ========================================================== */
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let bgParticles = [];

    function resizeBgCanvas() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeBgCanvas);
    resizeBgCanvas();

    class StarParticle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * bgCanvas.width;
        this.y = Math.random() * bgCanvas.height;
        this.radius = Math.random() * 1.6 + 0.4;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.alpha = Math.random() * 0.6 + 0.2;
        this.pulseSpeed = Math.random() * 0.02 + 0.005;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > bgCanvas.width || this.y < 0 || this.y > bgCanvas.height) {
          this.reset();
        }
        this.alpha += Math.sin(Date.now() * this.pulseSpeed) * 0.01;
      }
      draw() {
        bgCtx.save();
        bgCtx.beginPath();
        bgCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        bgCtx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, Math.min(0.8, this.alpha))})`;
        bgCtx.shadowBlur = 8;
        bgCtx.shadowColor = '#818cf8';
        bgCtx.fill();
        bgCtx.restore();
      }
    }

    for (let i = 0; i < 65; i++) {
      bgParticles.push(new StarParticle());
    }

    function animateBg() {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      bgParticles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateBg);
    }
    animateBg();

    /* ==========================================================
       7. CLIPBOARD & TOAST NOTIFICATION
       ========================================================== */
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-message');
    let toastTimeout = null;

    function showToast(message) {
      toastMsg.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2600);
    }

    document.getElementById('copy-btn').addEventListener('click', async () => {
      const text = mainGreeting.textContent;
      try {
        await navigator.clipboard.writeText(text);
        playTone(880, 'sine', 0.15, 0.08);
        showToast(`Copied "${text}" to clipboard!`);
      } catch (err) {
        showToast('Clipboard copy failed.');
      }
    });

    /* ==========================================================
       8. LIVE CLOCK
       ========================================================== */
    const clockEl = document.getElementById('clock');
    function updateClock() {
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Initial greeting setup
    displayGreeting(0);
  </script>
</body>
</html>
